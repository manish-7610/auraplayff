<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — AuraPlayFF Admin</title>
  <link rel="icon" href="/assets/img/image.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/assets/css/admin-theme.css">
  <style>
    .dash-lower-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 4px;
    }
    @media (max-width: 768px) {
      .dash-lower-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="toast-container"></div>

<div class="admin-shell">
  <div class="admin-main">
    <div class="admin-topbar"></div>
    <main class="admin-content">

      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">Dashboard</h1>
          <p class="page-subtitle">Platform overview — live metrics from backend</p>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-secondary" id="btn-refresh">↺ Refresh</button>
        </div>
      </div>

      <!-- Stats grid -->
      <div class="stats-grid" id="stats-grid">
        <!-- populated by JS -->
      </div>

      <!-- Two-column lower section -->
      <div class="dash-lower-grid" id="dash-lower">

        <!-- Recent tournaments -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Recent Tournaments</span>
            <a href="/admin/tournaments.html" class="btn btn-ghost btn-sm">View all →</a>
          </div>
          <div class="table-container" style="border:none">
            <table>
              <thead><tr>
                <th>Code</th><th>Fee</th><th>Status</th><th>Players</th><th>Scheduled</th>
              </tr></thead>
              <tbody id="dash-tourn-tbody">
                <tr><td colspan="5" style="text-align:center;padding:20px"><div class="loading-spinner"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Pending financial actions (admin only) -->
        <div class="card admin-only">
          <div class="card-header">
            <span class="card-title">⚡ Pending Actions</span>
          </div>
          <div id="dash-pending-list">
            <div style="text-align:center;padding:20px"><div class="loading-spinner"></div></div>
          </div>
        </div>

        <!-- Recent notifications -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">🔔 Recent Notifications</span>
            <a href="/admin/notifications.html" class="btn btn-ghost btn-sm">All →</a>
          </div>
          <div id="dash-notif-list">
            <div style="text-align:center;padding:20px"><div class="loading-spinner"></div></div>
          </div>
        </div>

        <!-- Agent quick stats (admin only) -->
        <div class="card admin-only">
          <div class="card-header">
            <span class="card-title">Agent Today</span>
            <a href="/admin/agents.html" class="btn btn-ghost btn-sm">Manage →</a>
          </div>
          <div id="dash-agents-list" style="padding:0 0 8px">
            <div style="text-align:center;padding:20px"><div class="loading-spinner"></div></div>
          </div>
        </div>

      </div><!-- end dash-lower -->

    </main>
  </div>
</div>

<script src="/assets/js/admin/admin-config.js"></script>
<script type="module">
  import { requireAdminSession } from '/assets/js/admin/admin-auth.js';
  import { getStaffProfile }    from '/assets/js/admin/admin-api.js';
  import { initAdminLayout }    from '/assets/js/admin/admin-layout.js';
  import { loadDashboard }      from '/assets/js/admin/admin-dashboard.js';

  (async () => {
    const profile = await requireAdminSession();
    if (!profile) return;

    await initAdminLayout({ page: 'dashboard', title: 'Dashboard' });

    // Update sidebar name from sessionStorage fallback
    const dn = sessionStorage.getItem('admin_display_name') || profile.display_name || profile.agent_id;
    const ai = sessionStorage.getItem('admin_agent_id') || profile.agent_id || '';
    const dnEl = document.getElementById('sidebar-display-name');
    const aiEl = document.getElementById('sidebar-agent-id');
    if (dnEl) dnEl.textContent = dn;
    if (aiEl) aiEl.textContent = ai;

    await loadDashboard();

    document.getElementById('btn-refresh')?.addEventListener('click', loadDashboard);

    // Collapse lower grid on mobile
    if (window.innerWidth < 768) {
      document.getElementById('dash-lower').style.gridTemplateColumns = '1fr';
    }
  })();
</script>
</body>
</html>
