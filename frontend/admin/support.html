<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Support — AuraPlayFF Admin</title>
  <link rel="stylesheet" href="/assets/css/admin-theme.css">
</head>
<body>
<div id="toast-container"></div>
<div class="admin-shell">
  <div class="admin-main">
    <div class="admin-topbar"></div>
    <main class="admin-content">

      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">🆘 Support</h1>
          <p class="page-subtitle">View and manage player help & support requests.</p>
        </div>
      </div>

      <!-- Filters -->
      <div class="filters-bar">
        <select class="form-select" id="filter-support-status" style="max-width:180px">
          <option value="">All Statuses</option>
          <option value="pending">⏳ Pending</option>
          <option value="in_progress">🔄 In Progress</option>
          <option value="resolved">✅ Resolved</option>
        </select>
        <button class="btn btn-secondary btn-sm" id="btn-refresh">↺ Refresh</button>
      </div>

      <!-- Table -->
      <div class="card" style="padding:0">
        <div class="table-container">
          <table>
            <thead><tr>
              <th>Request ID</th>
              <th>Username</th>
              <th>Tournament</th>
              <th>Issue (preview)</th>
              <th>Status</th>
              <th>Submitted</th>
              <th>Actions</th>
            </tr></thead>
            <tbody id="support-tbody">
              <tr><td colspan="7" style="text-align:center;padding:32px"><div class="loading-spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="support-pagination"></div>
      </div>

    </main>
  </div>
</div>

<!-- Support Request Detail Modal -->
<div class="modal-overlay" id="modal-support">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <span class="modal-title">Support Request</span>
      <button class="modal-close" id="btn-modal-close">✕</button>
    </div>
    <div id="modal-support-body">
      <div style="text-align:center;padding:40px"><div class="loading-spinner"></div></div>
    </div>
    <!-- Update form (shown inside modal) -->
    <div id="modal-update-form" style="border-top:1px solid var(--color-border);padding:var(--space-5);display:none">
      <div class="form-group" style="margin-bottom:var(--space-4)">
        <label class="form-label">Status</label>
        <select class="form-select" id="update-status">
          <option value="">— no change —</option>
          <option value="pending">⏳ Pending</option>
          <option value="in_progress">🔄 In Progress</option>
          <option value="resolved">✅ Resolved</option>
        </select>
      </div>
      <div class="form-group" style="margin-bottom:var(--space-4)">
        <label class="form-label">Response / Reply to Player</label>
        <textarea class="form-textarea" id="update-response" rows="4" maxlength="2000"
          placeholder="Enter your reply to the player…"></textarea>
      </div>
      <div style="display:flex;gap:var(--space-3)">
        <button class="btn btn-primary flex-1" id="btn-update-submit">Save Changes</button>
        <button class="btn btn-ghost flex-1" id="btn-update-cancel">Cancel</button>
      </div>
      <div class="alert alert-error hidden" id="update-error" style="margin-top:var(--space-3)"></div>
    </div>
  </div>
</div>

<script src="/assets/js/admin/admin-config.js"></script>
<script type="module">
  import { requireAdminSession } from '/assets/js/admin/admin-auth.js';
  import { initAdminLayout }    from '/assets/js/admin/admin-layout.js';
  import { setupModalClose }    from '/assets/js/admin/admin-ui.js';
  import {
    loadSupportList,
    setupSupportFilters,
    wireUpdateForm,
  } from '/assets/js/admin/admin-support.js';

  (async () => {
    const profile = await requireAdminSession();
    if (!profile) return;
    await initAdminLayout({ page: 'support', title: 'Support' });

    setupSupportFilters();
    wireUpdateForm();
    await loadSupportList();

    document.getElementById('btn-refresh').addEventListener('click', loadSupportList);

    document.getElementById('btn-modal-close').addEventListener('click', () => {
      document.getElementById('modal-support').classList.remove('open');
    });
    setupModalClose('modal-support');
  })();
</script>
</body>
</html>
