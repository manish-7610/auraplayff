<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — AuraPlayFF Admin</title>
  <link rel="icon" href="/assets/img/image.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/assets/css/admin-theme.css">
  <style>
    /* ── Tab bar ─────────────────────────────────────────────────────────── */
    .lb-tab-bar {
      display: flex;
      gap: 0;
      background: var(--color-bg-3);
      border-radius: var(--radius-lg);
      padding: 4px;
      margin-bottom: var(--space-5);
      width: fit-content;
    }
    .lb-tab-bar button {
      padding: var(--space-2) var(--space-5);
      border-radius: var(--radius-md);
      border: none;
      background: transparent;
      color: var(--color-text-muted);
      font-size: var(--text-sm);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .lb-tab-bar button.active {
      background: var(--color-card);
      color: var(--color-text);
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
    }

    /* ── Sort / window chips ─────────────────────────────────────────────── */
    .lb-chips {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
      margin-bottom: var(--space-4);
    }
    .lb-chip {
      padding: 4px 14px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      background: var(--color-bg-3);
      color: var(--color-text-muted);
      font-size: var(--text-xs);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
    }
    .lb-chip:hover  { border-color: var(--color-accent); color: var(--color-accent); }
    .lb-chip.active { border-color: var(--color-accent); color: var(--color-accent); background: var(--color-accent-glow); }

    /* ── Error alert ─────────────────────────────────────────────────────── */
    .lb-error {
      display: none;
      background: rgba(255,71,87,.1);
      border: 1px solid var(--color-danger);
      color: var(--color-danger);
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      font-size: var(--text-sm);
      margin-bottom: var(--space-4);
    }

    /* ── Tournament card header ──────────────────────────────────────────── */
    .lb-t-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--space-4);
      padding: var(--space-4) var(--space-5);
      flex-wrap: wrap;
    }
    .lb-t-card-left  { flex: 1; min-width: 0; }
    .lb-t-card-actions { flex-shrink: 0; padding-top: 2px; }

    .lb-t-title {
      font-size: var(--text-base);
      font-weight: 800;
      margin-bottom: var(--space-1);
      color: var(--color-text);
    }
    .lb-t-meta {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
      margin-bottom: var(--space-2);
    }
    .lb-meta-sep { color: var(--color-border-light); }

    /* ── Winner row inside tournament card ───────────────────────────────── */
    .lb-winner-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: var(--text-xs);
      margin-top: var(--space-2);
    }
    .lb-winner-medal { font-size: 16px; flex-shrink: 0; }
    .lb-winner-name  { font-weight: 700; color: var(--color-text); }
    .lb-winner-stat  { color: var(--color-text-muted); }
    .lb-winner-sep   { color: var(--color-border-light); }

    /* ── Top-10 expand icon ──────────────────────────────────────────────── */
    .lb-expand-icon { font-size: 10px; margin-right: 3px; }

    /* ── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 768px) {
      .lb-tab-bar { width: 100%; }
      .lb-tab-bar button { flex: 1; text-align: center; }
      .lb-t-card-header { padding: var(--space-3) var(--space-4); }
    }
    @media (max-width: 480px) {
      /* Hide FF UID column on very small screens */
      .hide-mobile { display: none; }
    }
  </style>
</head>
<body>
<div id="toast-container"></div>

<div class="admin-shell">
  <div class="admin-main">
    <div class="admin-topbar"></div>
    <main class="admin-content">

      <!-- Page header -->
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">🏅 Leaderboard</h1>
          <p class="page-subtitle">Read-only player and tournament statistics</p>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-secondary btn-sm" id="lb-btn-refresh">↺ Refresh</button>
        </div>
      </div>

      <!-- Main tab bar -->
      <div class="lb-tab-bar" role="tablist">
        <button data-lb-tab="players"     class="active" role="tab">🏅 Players</button>
        <button data-lb-tab="tournaments" role="tab">🏆 Tournaments</button>
      </div>

      <!-- ══════════════════════════════════════════════════════════════════
           PLAYERS PANEL
      ══════════════════════════════════════════════════════════════════ -->
      <div id="lb-panel-players">

        <!-- Sort chips -->
        <div class="lb-chips">
          <button class="lb-chip active" data-lb-sort="winnings">Total Winnings</button>
          <button class="lb-chip"        data-lb-sort="wins">Total Wins</button>
          <button class="lb-chip"        data-lb-sort="kills">Total Kills</button>
          <button class="lb-chip"        data-lb-sort="tournaments">Tournaments Played</button>
        </div>

        <!-- Error -->
        <div class="lb-error" id="lb-players-error"></div>

        <!-- Table -->
        <div class="card" style="padding:0">
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th style="width:56px">Rank</th>
                  <th>Player</th>
                  <th>Tournaments</th>
                  <th>Wins</th>
                  <th>Kills</th>
                  <th>Winnings</th>
                </tr>
              </thead>
              <tbody id="lb-players-tbody">
                <tr><td colspan="6" style="text-align:center;padding:32px">
                  <div class="loading-spinner"></div>
                </td></tr>
              </tbody>
            </table>
          </div>
          <div class="pagination" id="lb-players-pagination"></div>
        </div>

      </div><!-- /lb-panel-players -->

      <!-- ══════════════════════════════════════════════════════════════════
           TOURNAMENTS PANEL
      ══════════════════════════════════════════════════════════════════ -->
      <div id="lb-panel-tournaments" class="hidden">

        <!-- Window chips -->
        <div class="lb-chips">
          <button class="lb-chip active" data-lb-window="24h">Last 24 Hours</button>
          <button class="lb-chip"        data-lb-window="all">All Time</button>
        </div>

        <!-- Error -->
        <div class="lb-error" id="lb-tournaments-error"></div>

        <!-- Cards list -->
        <div id="lb-tournaments-list">
          <div style="text-align:center;padding:32px"><div class="loading-spinner"></div></div>
        </div>

        <div class="pagination" id="lb-tournaments-pagination"></div>

      </div><!-- /lb-panel-tournaments -->

    </main>
  </div>
</div>

<script src="/assets/js/admin/admin-config.js"></script>
<script type="module">
  import { requireAdminSession } from '/assets/js/admin/admin-auth.js';
  import { initAdminLayout }     from '/assets/js/admin/admin-layout.js';
  import { initLeaderboard }     from '/assets/js/admin/admin-leaderboard.js';

  (async () => {
    const profile = await requireAdminSession();
    if (!profile) return;

    await initAdminLayout({ page: 'leaderboard', title: 'Leaderboard' });

    // Update sidebar identity fields
    const dn = sessionStorage.getItem('admin_display_name') || profile.display_name || profile.agent_id;
    const ai = sessionStorage.getItem('admin_agent_id')     || profile.agent_id || '';
    const dnEl = document.getElementById('sidebar-display-name');
    const aiEl = document.getElementById('sidebar-agent-id');
    if (dnEl) dnEl.textContent = dn;
    if (aiEl) aiEl.textContent = ai;

    // Wire everything up and load initial data
    initLeaderboard();
  })();
</script>
</body>
</html>
