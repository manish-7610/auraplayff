<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — AuraPlayFF</title>
  <link rel="stylesheet" href="/assets/css/admin-theme.css">
</head>
<body>
<div id="toast-container"></div>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">🎮</div>
      <h1>AuraPlayFF</h1>
      <p>Staff / Admin Login</p>
    </div>

    <div id="login-error" class="alert alert-error" style="display:none"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="agent-id">Agent ID</label>
        <input
          type="text"
          id="agent-id"
          class="form-input"
          placeholder="e.g. ADMIN-001 or AGT-0001"
          autocomplete="username"
          required
          maxlength="20"
        >
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input
          type="password"
          id="password"
          class="form-input"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
          minlength="8"
          maxlength="128"
        >
      </div>
      <button type="submit" class="btn btn-primary btn-lg" id="login-btn" style="width:100%;justify-content:center;margin-top:8px">
        <span id="login-spinner" class="loading-spinner" style="display:none"></span>
        Log In
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:12px;color:var(--color-text-dim)">
      Player portal: <a href="/login.html">Player Login →</a>
    </p>
  </div>
</div>

<script src="/assets/js/admin/admin-config.js"></script>
<script type="module">
  import { adminLogin } from '/assets/js/admin/admin-auth.js';
  import { tryRestoreAdminSession } from '/assets/js/admin/admin-api.js';
  import { showToast } from '/assets/js/admin/admin-ui.js';

  // If already logged in, skip to dashboard
  (async () => {
    const profile = await tryRestoreAdminSession();
    if (profile) window.location.href = '/admin/index.html';
  })();

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const agentId  = document.getElementById('agent-id').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('login-btn');
    const spinner  = document.getElementById('login-spinner');
    const errBox   = document.getElementById('login-error');

    errBox.style.display = 'none';
    btn.disabled         = true;
    spinner.style.display = 'inline-block';

    try {
      const profile = await adminLogin(agentId, password);
      // Persist display info for layout (not token — token is in memory)
      sessionStorage.setItem('admin_display_name', profile.display_name || agentId);
      sessionStorage.setItem('admin_agent_id', agentId);
      sessionStorage.setItem('admin_role', profile.role || 'agent');
      window.location.href = '/admin/index.html';
    } catch (err) {
      errBox.textContent   = err.displayMessage || 'Login failed. Check credentials.';
      errBox.style.display = 'flex';
    } finally {
      btn.disabled          = false;
      spinner.style.display = 'none';
    }
  });
</script>
</body>
</html>
