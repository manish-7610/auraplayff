<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs — AuraPlayFF Admin</title>
  <link rel="stylesheet" href="/assets/css/admin-theme.css">
</head>
<body>
<div id="toast-container"></div>
<div class="admin-shell">
  <div class="admin-main">
    <div class="admin-topbar"></div>
    <main class="admin-content">

      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">Audit Logs</h1>
          <p class="page-subtitle">Immutable record of all sensitive platform actions — Super Admin only</p>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-secondary btn-sm" id="btn-audit-refresh">↺ Refresh</button>
        </div>
      </div>

      <div class="filters-bar">
        <input type="text" id="audit-filter-action"  class="form-input" placeholder="Filter by action…" maxlength="100" style="min-width:180px">
        <input type="text" id="audit-filter-actor"   class="form-input" placeholder="Actor ID…"         maxlength="80"  style="min-width:160px">
        <select class="form-select" id="audit-filter-entity">
          <option value="">All entity types</option>
          <option value="user">user</option>
          <option value="staff_user">staff_user</option>
          <option value="tournament">tournament</option>
          <option value="deposit">deposit</option>
          <option value="withdrawal">withdrawal</option>
          <option value="wallet">wallet</option>
          <option value="platform_setting">platform_setting</option>
          <option value="agent_salary">agent_salary</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="btn-audit-reset">✕ Reset</button>
      </div>

      <div class="card" style="padding:0">
        <div class="table-container">
          <table>
            <thead><tr>
              <th>Timestamp</th>
              <th>Actor</th>
              <th>Action</th>
              <th>Entity</th>
              <th>Metadata</th>
              <th>IP</th>
            </tr></thead>
            <tbody id="audit-tbody">
              <tr><td colspan="6" style="text-align:center;padding:32px"><div class="loading-spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="audit-pagination"></div>
      </div>

    </main>
  </div>
</div>

<script src="/assets/js/admin/admin-config.js"></script>
<script type="module">
  import { requireAdminSession } from '/assets/js/admin/admin-auth.js';
  import { initAdminLayout }    from '/assets/js/admin/admin-layout.js';
  import { loadAuditLogs, setupAuditFilters } from '/assets/js/admin/admin-audit.js';

  (async () => {
    const profile = await requireAdminSession();
    if (!profile) return;
    await initAdminLayout({ page: 'audit-logs', title: 'Audit Logs' });
    setupAuditFilters();
    await loadAuditLogs();
    document.getElementById('btn-audit-refresh').addEventListener('click', loadAuditLogs);
  })();
</script>
</body>
</html>
