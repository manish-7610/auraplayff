<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AuraPlayFF</title>
  <link rel="icon" href="/assets/img/image.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <style>
    /* ── Login page layout ────────────────────────────────────── */
    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-8) var(--space-4) var(--space-10);
    }
    /* Grid backdrop: defined in theme.css — no per-page override needed */

    .auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: var(--space-6);
    }

    .auth-logo-img {
      height: 52px;
      width: auto;
      margin: 0 auto var(--space-2);
      filter: drop-shadow(0 0 12px rgba(255,107,0,.35));
    }

    .auth-logo-tagline {
      font-size: var(--text-xs);
      font-weight: 600;
      color: var(--color-text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .auth-card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      box-shadow: 0 8px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,107,0,.06);
      position: relative;
      overflow: hidden;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--color-accent), var(--color-blue), var(--color-accent));
    }

    .auth-title {
      font-size: var(--text-xl);
      font-weight: 800;
      margin-bottom: var(--space-1);
      letter-spacing: -.4px;
    }

    .auth-subtitle {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
      margin-bottom: var(--space-6);
    }

    /* Password label row — label left, Forgot link right */
    .password-label-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }

    .forgot-link {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      text-decoration: none;
      transition: color var(--transition);
    }
    .forgot-link:hover { color: var(--color-accent); text-decoration: none; }

    .form-input {
      padding: 11px var(--space-4);
      font-size: var(--text-base);
      background: var(--color-bg-2);
      border: 1.5px solid var(--color-border);
    }

    .form-input:focus {
      border-color: var(--color-accent);
      box-shadow: 0 0 0 3px rgba(255,107,0,.14);
      background: var(--color-bg-3);
    }

    .btn-signin {
      width: 100%;
      padding: 13px var(--space-6);
      font-size: var(--text-base);
      font-weight: 700;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--color-accent) 0%, #e05a00 100%);
      color: #fff;
      border: none;
      box-shadow: 0 4px 16px rgba(255,107,0,.3);
      transition: all var(--transition);
      margin-top: var(--space-2);
      cursor: pointer;
    }
    .btn-signin:hover:not(:disabled) {
      background: linear-gradient(135deg, #ff7a1a 0%, var(--color-accent) 100%);
      box-shadow: 0 6px 20px rgba(255,107,0,.4);
      transform: translateY(-1px);
    }
    .btn-signin:disabled { opacity: .45; cursor: not-allowed; }

    /* Loading spinner state */
    .btn-signin.btn-loading { color: transparent !important; pointer-events: none; }
    .btn-signin.btn-loading::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }

    .auth-footer-block {
      text-align: center;
      margin-top: var(--space-6);
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .auth-footer-primary {
      font-size: var(--text-sm);
      color: var(--color-text-muted);
    }

    .auth-footer-primary a { color: var(--color-accent); font-weight: 600; }

    .auth-footer-back {
      font-size: var(--text-xs);
      color: var(--color-text-dim);
    }
    .auth-footer-back a { color: var(--color-text-dim); }
    .auth-footer-back a:hover { color: var(--color-text-muted); }

    #form-error { display: none; }

    @media (max-width: 460px) {
      body { padding: var(--space-6) var(--space-3) var(--space-10); }
      .auth-card { padding: var(--space-6) var(--space-5); border-radius: var(--radius-lg); }
      .auth-logo-img { height: 44px; }
    }
  </style>
</head>
<body>
  <div class="auth-container fade-in">
    <div class="auth-logo">
      <img src="/assets/img/image.png" alt="AuraPlayFF Logo" class="auth-logo-img">
      <div class="auth-logo-tagline">Free Fire Tournaments</div>
    </div>

    <div class="auth-card">
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your account to continue</p>

      <div id="form-error" class="alert alert-error mb-4">
        <span class="alert-icon">✕</span>
        <span id="form-error-msg"></span>
      </div>

      <form id="login-form" class="form-stack" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-input" id="username" type="text" name="username"
                 placeholder="your_username" autocomplete="username"
                 autocapitalize="none" spellcheck="false" required>
        </div>

        <div class="form-group">
          <div class="password-label-row">
            <label class="form-label" for="password">Password</label>
            <a href="/forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>
          <input class="form-input" id="password" type="password" name="password"
                 placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-signin" id="submit-btn">
          Sign In
        </button>
      </form>

      <div class="auth-footer-block">
        <div class="auth-footer-primary">
          Don't have an account? <a href="/register.html">Register here</a>
        </div>
        <div class="auth-footer-back">
          <a href="/index.html">← Back to home</a>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="/assets/js/config.js"></script>
  <script type="module">
    import { login, checkSession } from '/assets/js/auth.js';
    import { toastError, setButtonLoading, showFieldError, clearAllErrors } from '/assets/js/ui.js';

    // If already logged in, redirect
    (async () => {
      const ok = await checkSession();
      if (ok) {
        const params = new URLSearchParams(window.location.search);
        window.location.href = params.get('next') || '/index.html';
      }
    })();

    const form    = document.getElementById('login-form');
    const btn     = document.getElementById('submit-btn');
    const errBox  = document.getElementById('form-error');
    const errMsg  = document.getElementById('form-error-msg');

    function showFormError(msg) {
      errMsg.textContent = msg;
      errBox.style.display = 'flex';
    }
    function hideFormError() { errBox.style.display = 'none'; }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideFormError();
      clearAllErrors(form);

      const username = form.username.value.trim();
      const password = form.password.value;

      if (!username) { showFieldError(form.username, 'Username is required.'); return; }
      if (!password) { showFieldError(form.password, 'Password is required.'); return; }

      setButtonLoading(btn, true);
      try {
        await login({ username, password });

        // ── Onboarding check ─────────────────────────────────────────────────
        // After a successful login, silently fetch the player's profile to
        // check whether ff_name is set.  If it is missing, redirect to the
        // mandatory onboarding screen on the profile page instead of the
        // normal destination.
        // This check is best-effort: if /api/users/me fails for any reason
        // (network hiccup, unexpected error), we fall through to the normal
        // redirect so login is never completely blocked.
        const params = new URLSearchParams(window.location.search);
        try {
          const { apiGet } = await import('/assets/js/api.js');
          const me = await apiGet('/api/users/me');
          if (!me.ff_name) {
            // Player has no Free Fire name — send to mandatory onboarding.
            // Preserve the original ?next destination so after onboarding
            // completes the player lands where they intended.
            const dest = params.get('next') || '/index.html';
            window.location.href = `/profile.html?onboarding=1&next=${encodeURIComponent(dest)}`;
            return;
          }
        } catch (_) {
          // /api/users/me failed — fall through to normal redirect
        }

        window.location.href = params.get('next') || '/index.html';
      } catch (err) {
        setButtonLoading(btn, false);
        if (err.status === 429) {
          showFormError('Too many login attempts. Please wait a minute and try again.');
        } else if (err.status === 401 || err.status === 400) {
          showFormError('Incorrect username or password.');
        } else {
          showFormError(err.displayMessage || 'Login failed. Please try again.');
        }
      }
    });
  </script>
</body>
</html>
